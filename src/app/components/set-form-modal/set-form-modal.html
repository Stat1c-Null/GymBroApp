<app-modal [open]="open()" [wide]="true"
  [title]="isWeek()
    ? (isEditing() ? 'Edit Week' : 'Create Week')
    : (isEditing() ? 'Edit Set' : 'Create Set')"
  (close)="close.emit()">
  @if (error()) {
    <div class="auth-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 8v4M12 16h.01" />
      </svg>
      {{ error() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()">
    <!-- Name and description sit side by side once there's room for them. -->
    <div class="set-meta">
      <div class="form-group">
        <label class="form-label" for="set-name">Name</label>
        <input class="form-input" id="set-name" type="text" placeholder="e.g. Push Day"
          [(ngModel)]="name" name="name" autocomplete="off" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="set-description">Description (optional)</label>
        <textarea class="form-input form-textarea" id="set-description" rows="2" maxlength="300"
          placeholder="What this set is for" [(ngModel)]="description" name="description"></textarea>
      </div>
    </div>

    @if (isWeek()) {
      <!-- Seven day sections over the one flat block list. Days with exercises
           start open; empty ones stay collapsed so the whole week fits. -->
      <div class="week-days">
        @for (day of dayIndices; track day) {
          @let dayItems = itemsForDay(day);
          <section class="week-day" [class.week-day-open]="isExpanded(day)">
            <button type="button" class="week-day-head" (click)="toggleDay(day)"
              [attr.aria-expanded]="isExpanded(day)">
              <svg class="week-day-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6" />
              </svg>
              <span class="week-day-label">{{ dayLabels[day] }}</span>
              <span class="week-day-count">
                @if (dayItems.length) {
                  {{ dayItems.length }} {{ dayItems.length === 1 ? 'exercise' : 'exercises' }}
                } @else {
                  rest day
                }
              </span>
            </button>

            @if (isExpanded(day)) {
              <div class="week-day-body">
                <div class="set-items">
                  @for (item of dayItems; track item.key) {
                    <app-set-item-editor [item]="item" [position]="$index + 1"
                      (remove)="removeItem(item)" (createWorkout)="creatingFor.set(item)" />
                  }
                </div>

                <button type="button" class="btn btn-secondary btn-full mt-2" (click)="addItem(day)">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round">
                    <path d="M12 5v14M5 12h14" />
                  </svg>
                  Add exercise to {{ dayLabels[day] }}
                </button>
              </div>
            }
          </section>
        }
      </div>

      <div class="set-actions">
        <button type="submit" class="btn btn-primary btn-full mt-2" [disabled]="saving()">
          @if (saving()) {
            <span class="spinner"></span>
            Saving...
          } @else {
            {{ isEditing() ? 'Save Changes' : 'Save Week' }}
          }
        </button>
      </div>
    } @else {
      <!-- One column per exercise on desktop, wrapping to the next row after
           four; a plain stack on mobile. -->
      <div class="set-items">
        @for (item of items(); track item.key) {
          <app-set-item-editor [item]="item" [position]="$index + 1" (remove)="removeItem(item)"
            (createWorkout)="creatingFor.set(item)" />
        }
      </div>

      <div class="set-actions">
        <button type="button" class="btn btn-secondary btn-full mt-2" (click)="addItem(0)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          Add exercise
        </button>

        <button type="submit" class="btn btn-primary btn-full mt-2" [disabled]="saving()">
          @if (saving()) {
            <span class="spinner"></span>
            Saving...
          } @else {
            {{ isEditing() ? 'Save Changes' : 'Save Set' }}
          }
        </button>
      </div>
    }
  </form>
</app-modal>

<!-- "Create new workout", layered over the builder exactly as it layers over
     the Weeks logging modal. -->
<app-workout-form-modal [open]="creatingFor() !== null" [presetGroup]="createPresetGroup()"
  (close)="creatingFor.set(null)" (saved)="onWorkoutCreated($event)" />

<app-modal [open]="open()" [title]="isEditing() ? 'Edit Set' : 'Create Set'" [wide]="true"
  (close)="close.emit()">
  @if (error()) {
    <div class="auth-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 8v4M12 16h.01" />
      </svg>
      {{ error() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()">
    <!-- Name and description sit side by side once there's room for them. -->
    <div class="set-meta">
      <div class="form-group">
        <label class="form-label" for="set-name">Name</label>
        <input class="form-input" id="set-name" type="text" placeholder="e.g. Push Day"
          [(ngModel)]="name" name="name" autocomplete="off" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="set-description">Description (optional)</label>
        <textarea class="form-input form-textarea" id="set-description" rows="2" maxlength="300"
          placeholder="What this set is for" [(ngModel)]="description" name="description"></textarea>
      </div>
    </div>

    <!-- One column per exercise on desktop, wrapping to the next row after
         four; a plain stack on mobile. -->
    <div class="set-items">
      @for (item of items(); track item.key) {
        <app-set-item-editor [item]="item" [position]="$index + 1" (remove)="removeItem(item)"
          (createWorkout)="creatingFor.set(item)" />
      }
    </div>

    <div class="set-actions">
      <button type="button" class="btn btn-secondary btn-full mt-2" (click)="addItem()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Add exercise
      </button>

      <button type="submit" class="btn btn-primary btn-full mt-2" [disabled]="saving()">
        @if (saving()) {
          <span class="spinner"></span>
          Saving...
        } @else {
          {{ isEditing() ? 'Save Changes' : 'Save Set' }}
        }
      </button>
    </div>
  </form>
</app-modal>

<!-- "Create new workout", layered over the builder exactly as it layers over
     the Weeks logging modal. -->
<app-workout-form-modal [open]="creatingFor() !== null" [presetGroup]="createPresetGroup()"
  (close)="creatingFor.set(null)" (saved)="onWorkoutCreated($event)" />

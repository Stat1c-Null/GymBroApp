<section class="page dashboard">
  <!-- Greeting + quick access: one slim bar instead of a full welcome card, so
       the summary below gets the space. -->
  <header class="dash-bar glass-card">
    <div class="dash-greeting">
      <app-brand-logo [size]="32" />
      <h1 class="dash-title">Welcome back, {{ authService.displayName() }}</h1>
    </div>
    <nav class="quick-links" aria-label="Quick access">
      <a class="quick-link quick-link-primary" routerLink="/weeks">This Week</a>
      <a class="quick-link" routerLink="/workouts">Workouts</a>
      <a class="quick-link" routerLink="/weights">Weight</a>
      <a class="quick-link" routerLink="/changelog">Changelog</a>
    </nav>
  </header>

  <!-- One range for both cards, never one each — see DashboardComponent. -->
  <div class="section-head">
    <h2 class="section-title">Progress</h2>
    <app-range-selector [(range)]="range" />
  </div>
  <div class="dash-analytics">
    <app-weight-burndown [range]="range()" [compact]="true" />
    <app-training-totals [range]="range()" [compact]="true" />
  </div>

  <app-today-workouts />

  @if (latestRelease; as release) {
    <app-analytics-card title="What's new" subtitle="The latest update to GymBro.">
      <a actions class="card-link" routerLink="/changelog">All updates →</a>
      <app-changelog-entry
        [version]="release.version"
        [date]="release.date"
        [changes]="release.changes"
      />
    </app-analytics-card>
  }
</section>

# Local run without PostgreSQL: in-memory H2 in PostgreSQL compatibility mode.
# Migrations still run, so the Liquibase changelogs stay honest.
#   mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  datasource:
    # A fresh in-memory database per application context: two contexts in one
    # test JVM must not fight over Liquibase's changelog table.
    url: jdbc:h2:mem:gymbro_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true

logging:
  level:
    com.gymbro.backend: DEBUG
    org.hibernate.SQL: DEBUG
